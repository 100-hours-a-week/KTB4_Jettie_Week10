<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <div class="signup-container">
        <div class="title">
            <button class="back-btn"> < </button>
            <a href="posts.html" class="home-link">
                <h1>아무 말 대잔치</h1>
            </a>
        </div>
        <hr class="main-hr">
        <div class="content">
            <h2>회원가입</h2>
            <div class="detail-content">
                <div class="input-container">
                    <label>프로필 사진</label>
                    <div class="error-message" id="profile-image-error"></div>
                    <label for="profile-image" class="profile-image-upload">
                        <span class="profile-image-plus">+</span>
                    </label>
                    <input type="file" id="profile-image" accept="image/*"/>
                </div>
                <div class="input-container">
                    <label for="email">이메일*</label>
                    <input type="email" id="email" class="input" placeholder="이메일을 입력하세요."/>
                    <div class="error-message" id="email-error"></div>
                </div>
                <div class="input-container">
                    <label for="password">비밀번호*</label>
                    <input type="password" id="password" class="input" placeholder="비밀번호를 입력하세요."/>
                    <div class="error-message" id="password-error"></div>
                </div>
                <div class="input-container">
                    <label for="password-check">비밀번호 확인*</label>
                    <input type="password" id="password-check" class="input" placeholder="비밀번호를 한 번 더 입력하세요."/>
                    <div class="error-message" id="password-check-error"></div>
                </div>
                <div class="input-container">
                    <label for="nickname">닉네임*</label>
                    <input type="text" id="nickname" class="input" placeholder="닉네임을 입력하세요."/>
                    <div class="error-message" id="nickname-error"></div>
                </div>
                <div><button class="signup-btn">회원가입</button></div>
                <div><a class="login-link" href="login.html">로그인하러 가기</a></div>
            </div>
        </div>
    </div>
    <script src="signup.js"></script>
</body>
</html>
