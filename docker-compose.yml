services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jettie-backend
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      TZ: Asia/Seoul
      JAVA_TOOL_OPTIONS: "-Duser.timezone=Asia/Seoul"
    restart: unless-stopped

  frontend:
    build:
      context: ./react-project
      dockerfile: Dockerfile
    container_name: jettie-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
