<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Update</title>
    <link rel="stylesheet" href="password-update.css">
</head>
<body>
    <div class="password-update-container">
        <div class="title">
            <a href="posts.html" class="home-link">
                <h1>아무 말 대잔치</h1>
            </a>
            <div class="profile-menu">
                <button class="user-info-btn header-profile-circle">
                    <img class="profile-image header-profile-image" alt="프로필사진">
                </button>
                <div class="profile-dropdown">
                    <a class="profile-dropdown-menu" href="user-update.html">회원정보수정</a>
                    <a class="profile-dropdown-menu" href="password-update.html">비밀번호 수정</a>
                    <a class="profile-dropdown-menu" href="my-post.html">나의 기록</a>
                    <button class="profile-dropdown-menu logout-btn">로그아웃</button>
                </div>
            </div>
        </div>
        <hr class="main-hr">
        <div class="content-wrap">
            <h2>비밀번호 수정</h2>
            <div class="detail-content">
                <div class="input-container">
                    <label for="password">현재 비밀번호*</label>
                    <input type="password" id="password" class="input" placeholder="현재 비밀번호를 입력하세요."/>
                    <div class="error-message" id="password-error"></div>
                </div>
                <div class="input-container">
                    <label for="password">새 비밀번호*</label>
                    <input type="password" id="password" class="input" placeholder="새 비밀번호를 입력하세요."/>
                    <div class="error-message" id="password-error"></div>
                </div>
                <div class="input-container">
                    <label for="password-check">새 비밀번호 확인*</label>
                    <input type="password" id="password-check" class="input" placeholder="새 비밀번호를 한 번 더 입력하세요."/>
                    <div class="error-message" id="password-check-error"></div>
                </div>
                <div><button class="password-update-btn">수정하기</button></div>
                <div class="password-update-complete">수정완료</div>
            </div>
        </div>
    </div>
    <script src="api.js"></script>
    <script src="password-update.js"></script>
</body>
</html>
