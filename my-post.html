<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Post</title>

    <link rel="stylesheet" href="my-post.css">
</head>

<body>
    <div class="posts-container">
        <div class="title">
            <button class="back-btn">&lt;</button>

            <a href="posts.html" class="home-link">
                <h1>아무 말 대잔치</h1>
            </a>
            <div class="profile-menu">
                <button class="user-info-btn header-profile-circle">
                    <img class="profile-image header-profile-image" alt="프로필사진">
                </button>
                <div class="profile-dropdown">
                    <a class="profile-dropdown-menu" href="user-update.html">회원정보수정</a>
                    <a class="profile-dropdown-menu" href="password-update.html">비밀번호 수정</a>
                    <a class="profile-dropdown-menu" href="my-post.html">나의 기록</a>
                    <button class="profile-dropdown-menu logout-btn">로그아웃</button>
                </div>
            </div>
        </div>

        <hr class="main-hr">

        <main class="content">
            <h2>나의 기록</h2>

            <div class="detail-content">
                <select class="sort-select">
                    <option value="latest-sort">최신순</option>
                    <option value="like-sort">좋아요순</option>
                    <option value="view-sort">조회수순</option>
                </select>

                <div class="my-post-list"></div>
            </div>
        </main>
    </div>

    <script src="api.js"></script>
    <script src="my-post.js"></script>
</body>
</html>
