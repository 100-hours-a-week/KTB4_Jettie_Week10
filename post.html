<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link rel="stylesheet" href="post.css">
</head>
<body>
    <div class="post-container">
        <div class="title">
            <button class="back-btn"> < </button>
            <a href="posts.html" class="home-link">
                <h1>아무 말 대잔치</h1>
            </a>
            <button class="user-info-btn header-profile-circle">
                <img class="profile-image header-profile-image" alt="프로필사진">
            </button>
            <div class="profile-dropdown">
                <a class="profile-dropdown-menu" href="user-update.html">회원정보수정</a>
                <a class="profile-dropdown-menu" href="password-update.html">비밀번호 수정</a>
                <button class="profile-dropdown-menu logout-btn">로그아웃</button>
            </div>
        </div>
        <hr class="main-hr">
        <div class="content">
            <div class="post-wrap">
                <div class="post-info-wrap">
                    <div class="post-title"></div>
                    <div class="post-info">
                        <div class="post-creator-info">
                            <div class="post-creator">
                                <div class="profile-circle">
                                    <img class="profile-image post-writer-profile-image" alt="프로필사진">
                                </div>
                                <span></span>
                            </div>
                            <span class="post-create-date"></span>
                        </div>
                        <div class="post-actions">
                            <a class="post-btn" id="post-update-btn" href="post-update.html">수정</a>
                            <button class="post-btn" id="post-delete-btn">삭제</button>
                        </div>
                    </div>
                </div>
                <hr>
                <div class="post-content-wrap">
                    <img class="post-image" alt="게시글 이미지">
                    <div class="post-content"></div>
                    <div class="post-count-wrap">
                        <button class="post-count" id="liked-count-btn">
                            <span id="liked-count">0</span>
                            <span>좋아요수</span>
                        </button>
                        <button class="post-count" id="view-count-btn">
                            <span>0</span>
                            <span>조회수</span>
                        </button>
                        <button class="post-count" id="comment-count-btn">
                            <span>0</span>
                            <span>댓글수</span>
                        </button>
                    </div>
                </div>
            </div>
            <hr>
            <div class="comment-wrap">
                <div class="comment-create">
                    <div class="comment-create-input"><textarea type="text" id="comment-create" placeholder="댓글을 남겨주세요!"></textarea></div>
                    <hr>
                    <button class="comment-create-btn">댓글 등록</button>
                </div>
                <div class="comments">
                </div>
            </div>
        </div>
    </div>
    <div class="modal-overlay post-delete-modal-overlay">
        <div class="post-delete-modal">
            <p class="modal-title">게시글을 삭제하시겠습니까?</p>
            <p class="modal-content">삭제된 내용은 복구할 수 없습니다.</p>
            <div class="modal-btn-wrap">
                <button class="cancel-btn post-delete-cancel-btn">취소</button>
                <button class="post-delete-confirm-btn">확인</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay comment-delete-modal-overlay">
        <div class="comment-delete-modal">
            <p class="modal-title">댓글을 삭제하시겠습니까?</p>
            <p class="modal-content">삭제된 내용은 복구할 수 없습니다.</p>
            <div class="modal-btn-wrap">
                <button class="cancel-btn comment-delete-cancel-btn">취소</button>
                <button class="comment-delete-confirm-btn">확인</button>
            </div>
        </div>  
    </div>
    <script src="post.js"></script>
</body>
</html>
