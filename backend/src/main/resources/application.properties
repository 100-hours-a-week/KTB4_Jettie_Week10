spring.application.name=KTB4_Jettie_WEEK4

# SQL 스크립트 자동 실행 여부
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}

# 데이터소스
# Docker에서는 환경변수로 MySQL 설정을 주입하고,
# 환경변수가 없으면 로컬에서 H2 파일 DB를 사용
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/jettie}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA 엔티티를 기준으로 테이블 생성 또는 기존 구조 업데이트
spring.jpa.hibernate.ddl-auto=update

# JWT
# 실제 비밀키는 application.properties에 직접 작성하지 않고 환경변수로 주입
jwt.secret=${JWT_SECRET}

# H2 콘솔
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SQL 로그 확인
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG
logging.level.org.springframework.jdbc.core.StatementCreatorUtils=TRACE

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.jackson.time-zone=Asia/Seoul