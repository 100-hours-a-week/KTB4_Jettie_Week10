<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Update</title>
    <link rel="stylesheet" href="post-update.css">
</head>
<body>
    <div class="post-update-container">
        <div class="title">
            <button class="back-btn"> < </button>
            <a href="posts.html" class="home-link">
                <h1>아무 말 대잔치</h1>
            </a>
            <button class="user-info-btn header-profile-circle">
                <img class="profile-image header-profile-image" alt="프로필사진">
            </button>
            <div class="profile-dropdown">
                <a class="profile-dropdown-menu" href="user-update.html">회원정보수정</a>
                <a class="profile-dropdown-menu" href="password-update.html">비밀번호 수정</a>
                <button class="profile-dropdown-menu">로그아웃</button>
            </div>
        </div>

        <hr class="main-hr">

        <div class="content-wrap">
            <h2>게시글 수정</h2>

            <div class="content">
                <div>
                    <label for="title">제목*</label>
                </div>
                <hr>

                <div>
                    <input id="title"/>
                </div>
                <hr>

                <div>
                    <label for="content">내용*</label>
                </div>
                <hr>

                <div>
                    <textarea id="content"></textarea>
                </div>
                <hr>

                <span class="error-message" id="post-update-error"></span>

                <div>
                    <label for="post-image">이미지</label>
                    <input type="file" id="post-image" accept="image/*"/>
                </div>

                <div>
                    <img id="post-image-preview" alt="게시글 이미지 미리보기" style="display: none; max-width: 100%;">
                </div>

                <button class="post-update-btn">수정하기</button>
            </div>
        </div>
    </div>

    <script src="post-update.js"></script>
</body>
</html>
