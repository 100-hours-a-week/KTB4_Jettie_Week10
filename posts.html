<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts</title>
    <link rel="stylesheet" href="posts.css">
</head>
<body>

                <a class="profile-dropdown-menu" href="user-update.html">회원정보수정</a>

            <div class="detail-content">
                <a class="post-create-btn" href="post-create.html">게시글 작성</a>
