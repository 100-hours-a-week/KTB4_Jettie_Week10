<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Update</title>
    <link rel="stylesheet" href="user-update.css">
</head>
<body>
    <div class="user-update-container">
        <div class="title">
            <a href="posts.html" class="home-link">
                <h1>아무 말 대잔치</h1>
            </a>
            <div class="profile-menu">
                <button class="user-info-btn header-profile-circle">
                    <img class="profile-image header-profile-image" alt="프로필사진">
                </button>
                <div class="profile-dropdown">
                    <a class="profile-dropdown-menu" href="user-update.html">회원정보수정</a>
                    <a class="profile-dropdown-menu" href="password-update.html">비밀번호 수정</a>
                    <a class="profile-dropdown-menu" href="my-post.html">나의 기록</a>
                    <button class="profile-dropdown-menu logout-btn">로그아웃</button>
                </div>
            </div>
        </div>
        <hr class="main-hr">
        <div class="content-wrap">
            <h2>회원정보수정</h2>
            <div class="content">
                <div class="input-container">
                    <label for="profile-image">프로필 사진*</label>
                    <label for="profile-image" class="profile-image-upload">
                        <img class="user-profile-preview" alt="프로필사진">
                        <span class="profile-image-text">변경</span>
                    </label>
                    <input type="file" id="profile-image" accept="image/*"/>
                </div>
                <div class="input-container">
                    <label for="email">이메일</label>
                    <div id="email"></div>
                </div>
                <div class="input-container">
                    <label for="nickname">닉네임</label>
                    <input type="text" id="nickname" class="input" placeholder="기존 닉네임"/>
                </div>
                <div class="error-message" id="nickname-error"></div>
                <button class="user-update-btn">수정하기</button>
                <button class="user-delete-btn">회원 탈퇴</button>
                <div class="user-update-complete">수정완료</div>
            </div>
        </div>
    </div>
    <div class="modal-overlay user-delete-modal-overlay">
        <div class="user-delete-modal">
            <p class="modal-title">회원탈퇴 하시겠습니까?</p>
            <p class="modal-content">작성된 게시글과 댓글은 삭제됩니다.</p>
            <div class="modal-btn-wrap">
                <button class="user-delete-cancel-btn">취소</button>
                <button class="user-delete-confirm-btn">확인</button>
            </div>
        </div>
    </div>
    <script src="api.js"></script>
    <script src="user-update.js"></script>
</body>
